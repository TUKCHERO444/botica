name: Monitor de produccion

# Se ejecuta desde los servidores de GitHub (fuera de tu VPS).
# Si algo falla, GitHub lo marca en rojo y te avisa por correo.

on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 minutos
  workflow_dispatch:          # permite lanzarlo a mano desde la pestaña Actions

concurrency:
  group: monitor-produccion
  cancel-in-progress: false

env:
  SITIO: https://bonifarmachiclayo.com

jobs:
  comprobar:
    name: Sitio, estado del servidor y certificado
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 1. La web responde (health check)
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 "$SITIO/up" || echo 000)
          echo "/up -> $codigo"
          if [ "$codigo" != "200" ]; then
            echo "::error::/up devolvio $codigo"
            exit 1
          fi

      - name: 2. El servidor reporta estado OK
        run: |
          estado=$(curl -sS --max-time 20 "$SITIO/estado.txt" || true)
          echo "estado.txt: ${estado:-<sin respuesta>}"
          if ! echo "$estado" | grep -q '^OK'; then
            echo "::error::el servidor reporta: ${estado:-sin respuesta}"
            exit 1
          fi

      - name: 3. El certificado tiene margen
        run: |
          fin=$(echo | openssl s_client -servername bonifarmachiclayo.com \
                 -connect bonifarmachiclayo.com:443 2>/dev/null \
                 | openssl x509 -noout -enddate | cut -d= -f2)
          dias=$(( ( $(date -d "$fin" +%s) - $(date +%s) ) / 86400 ))
          echo "el certificado vence en $dias dias ($fin)"
          if [ "$dias" -lt 14 ]; then
            echo "::error::el certificado vence en $dias dias"
            exit 1
          fi

      - name: 4. La tienda carga
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITIO/" || echo 000)
          echo "/ -> $codigo"
          if [ "$codigo" != "200" ]; then
            echo "::error::la home devolvio $codigo"
            exit 1
          fi
